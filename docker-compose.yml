---
services:
  hud-valorant:
    image: ghcr.io/navtsptbr/hud-valorant-navtstyle-spectra:latest
    # para montar a partir desta pasta em vez da imagem pronta, troque a linha acima por:  build: .
    ports:
      - "3000:80"
    volumes:
      - ./config:/usr/share/nginx/html/config
    restart: unless-stopped
