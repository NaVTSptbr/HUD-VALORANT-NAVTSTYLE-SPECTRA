---
services:
  hud-valorant:
    image: ghcr.io/navtsptbr/hud-valorant-navtstyle-spectra:latest
    # para montar a partir desta pasta em vez da imagem pronta, troque a linha acima por:  build: .
    ports:
      - "3000:80"
    volumes:
      - ./config:/usr/share/nginx/html/config
      # fontes próprias (opcional): coloque os arquivos em ./fontes e descomente
      # - ./fontes/FoundryGridnik-Regular.otf:/usr/share/nginx/html/Resources/FoundryGridnik-Regular.otf
      # - ./fontes/FoundryGridnik-Bold.otf:/usr/share/nginx/html/Resources/FoundryGridnik-Bold.otf
      # - ./fontes/FoundryGridnik-ExtraBold.otf:/usr/share/nginx/html/Resources/FoundryGridnik-ExtraBold.otf
      # - ./fontes/Tungsten-Bold.ttf:/usr/share/nginx/html/Resources/Tungsten-Bold.ttf
    restart: unless-stopped
